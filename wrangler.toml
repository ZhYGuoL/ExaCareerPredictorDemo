name = "career-paths"
main = "src/index.ts"
compatibility_date = "2025-09-29"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# For local development: Set EXA_KEY in .dev.vars file (not committed to git)
# For production: Set as a secret via Cloudflare Dashboard or:
#   wrangler secret put EXA_KEY
# ============================================================================

# ============================================================================
# BINDINGS CONFIGURATION
# ============================================================================
# These resources must be created in your Cloudflare account before deploying
# ============================================================================

# D1 Database for storing user profiles and Webset mappings
[[d1_databases]]
binding = "DB"
database_name = "app"
database_id = "3230e3bc-d6ba-4f29-9ad9-7b929eeeae7a"
preview_database_id = "f3c20ed4-c7a0-4d28-bc8a-4f24cf659979"

# Queue for background processing of LinkedIn profiles
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "ingest"

[[queues.consumers]]
queue = "ingest"
max_batch_size = 10
max_batch_timeout = 30

# R2 Bucket for storing raw profile data
[[r2_buckets]]
binding = "BLOB"
bucket_name = "raw-artifacts"
preview_bucket_name = "raw-artifacts-preview"

# Optional: Workers AI for natural language processing
[ai]
binding = "AI"

# Keep ReRanker class and binding for backward compatibility
[[durable_objects.bindings]]
name = "RERANKER"
class_name = "ReRanker"

[[migrations]]
tag = "v1"
new_classes = ["ReRanker"]
